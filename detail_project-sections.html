  <!--  GLOBAL MASTER CSS ANIMATION STYLES  -->
  <style>
  /* --- 1. ANIMATE-TEXT (Line-Reveal Styles) --- */
  .line-mask {
    overflow: hidden !important;
    padding-bottom: 0.12em !important;
    margin-bottom: -0.12em !important;
  }
  .line-inner {
    display: block !important;
    will-change: transform, opacity;
  }
  /* --- 2. SCROLL-HIGHLIGHT (Character/Word Fades) --- */
  .scroll-highlight .char,
  .scroll-highlight .word {
    padding-bottom: 0.1em !important;
    margin-bottom: -0.1em !important;
    overflow: visible !important;
    vertical-align: baseline !important;
  }
  /* --- 3. ANIMATE-IMAGE & TABS (Overlay Reveal & Scale) --- */
  .animate-image,
  .featured_image {
    position: relative;
    overflow: hidden;
  }
  .animate-image img,
  .featured_image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
    transition: none !important;
  }
  .image_reveal_overlay {
    position: absolute;
    inset: 0;
    background: #151a22;
    z-index: 3;
    pointer-events: none;
    will-change: transform;
    transform: translateZ(0);
  }
  /* --- 4. TABS UI STATE --- */
  .list_item {
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.3s ease;
  }
  .list_item.is-active {
    opacity: 1;
  }
  .progress_line {
    overflow: hidden;
  }
  .active_progress_line {
    width: 100%;
    transform-origin: left center;
    transform: scaleX(0);
  }
  /* --- 5. DIVIDERS --- */
  .top_divider,
  .bottom_divider,
  .stat_divider,
  .testimonial_divider {

    position: fixed;

  <!--  GLOBAL MASTER JAVASCRIPT ENGINE  -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    // Safe Guard: Do not execute animations inside Webflow Designer Canvas
    if (window.Webflow && window.Webflow.env('editor')) return;
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.config({ ignoreMobileResize: true });
    const isMobile = window.matchMedia('(max-width: 767px)').matches;
    const anim = {
      textDuration: isMobile ? 0.75 : 1,
      imageDuration: isMobile ? 0.85 : 1.1,
      imageScale: isMobile ? 1.03 : 1.08,
      stagger: isMobile ? 0.035 : 0.065,
      start: isMobile ? 'top 65%' : 'top 55%',
    };
    // ============================================================
    // 1. SWIPER SLIDER INITIALIZATION
    // ============================================================
    document.querySelectorAll('.team-slider_component').forEach((component) => {
      const cmsWrap = component.querySelector('.swiper');
      if (!cmsWrap) return;
      new Swiper(cmsWrap, {
        slidesPerView: 'auto',
        followFinger: true,
        freeMode: false,
        slideToClickedSlide: false,
        centeredSlides: false,
        autoHeight: false,
        speed: 300,
        slideActiveClass: 'is-active',
        slideDuplicateActiveClass: 'is-active',
        mousewheel: { forceToAxis: true },
        keyboard: { enabled: true, onlyInViewport: true },
        navigation: {
          nextEl: component.querySelector('.team-slider_btn_element.is-next'),
          prevEl: component.querySelector('.team-slider_btn_element.is-prev'),
        },
        pagination: {
          el: component.querySelector('.team-slider_bullet_wrap'),
          bulletActiveClass: 'is-active',
          bulletClass: 'team-slider_bullet_item',
          bulletElement: 'button',
          clickable: true,
        },
        scrollbar: {
          el: component.querySelector('.team-slider_draggable_wrap'),
          draggable: true,
          dragClass: 'team-slider_draggable_handle',
          snapOnRelease: true,
        },
        on: {
          init: () => {
            if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
          },
        },
      });
    });
    // ============================================================
    // 2. UTILITY: LINE-REVEAL TEXT (.animate-text)
    // ============================================================
    function prepareText(element) {
      if (!element || element.dataset.splitDone === 'true') return [];
      element.dataset.splitDone = 'true';
      element.innerHTML = element.innerHTML.replace(/[\u2028\u2029\r\n]/g, ' ').trim();
      const split = new SplitType(element, {
        types: 'lines',
        lineClass: 'split-line',
      });
      split.lines.forEach((line) => {
        const wrapper = document.createElement('div');
        wrapper.classList.add('line-mask');
        const inner = document.createElement('span');
        inner.classList.add('line-inner');
        inner.innerHTML = line.innerHTML;
        line.innerHTML = '';
        line.appendChild(inner);
        line.parentNode.insertBefore(wrapper, line);
        wrapper.appendChild(line);
      });
      const lines = element.querySelectorAll('.line-inner');
      gsap.set(lines, { yPercent: 110, opacity: 0 });
      return lines;
    }
    document.querySelectorAll('.animate-text').forEach((textElement) => {
      const lines = prepareText(textElement);
      if (!lines.length) return;
      gsap.to(lines, {
        yPercent: 0,
        opacity: 1,
        duration: anim.textDuration,
        stagger: anim.stagger,
        ease: 'power4.out',
        scrollTrigger: {
          trigger: textElement,
          start: isMobile ? 'top 85%' : 'top 75%',
          once: true,
          invalidateOnRefresh: true,
        },
      });
    });
    // ============================================================
    // 3. UTILITY: IMAGE REVEAL (.animate-image)
    // ============================================================
    document.querySelectorAll('.animate-image').forEach((imageWrap) => {
      if (imageWrap.dataset.imageDone === 'true') return;
      const image = imageWrap.querySelector('img');
      if (!image) return;
      imageWrap.dataset.imageDone = 'true';
      let overlay = imageWrap.querySelector('.image_reveal_overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.classList.add('image_reveal_overlay');
        imageWrap.appendChild(overlay);
      }
      gsap.set(overlay, { xPercent: 0 });
      gsap.set(image, { scale: anim.imageScale });
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: imageWrap,
          start: isMobile ? 'top 70%' : 'top 60%',
          once: true,
          invalidateOnRefresh: true,
        },
      });
      tl.to(
        overlay,
        {
          xPercent: 100,
          duration: anim.imageDuration,
          ease: 'power4.inOut',
        },
        0,
      ).to(
        image,
        {
          scale: 1,
          duration: anim.imageDuration + 0.15,
          ease: 'power4.out',
        },
        0,
      );
    });
    // ============================================================
    // 4. UTILITY: SCROLL HIGHLIGHT TEXT (.scroll-highlight)
    // ============================================================
    document.querySelectorAll('.scroll-highlight').forEach((highlightEl) => {
      // Clean up invisible formatting characters
      highlightEl.innerHTML = highlightEl.innerHTML.replace(/[\u2028\u2029\r\n]/g, ' ').trim();
      // Original working SplitType setup
      const text = new SplitType(highlightEl, { types: ['chars', 'words'] });
      // Original gsap.from() logic
      gsap.from(text.chars, {
        scrollTrigger: {
          trigger: highlightEl,
          start: 'top 80%',
          end: 'top 20%',
          scrub: true,
        },
        opacity: 0.2,
        stagger: 0.1,
      });
    });
    // ============================================================
    // 5. INTERACTIVE COMPONENT: STATISTICS COUNTER
    // ============================================================
    document.querySelectorAll('.statistics').forEach((section) => {
      const statItems = section.querySelectorAll('.stat_item');
      if (!statItems.length) return;
      const animateDivider = (divider, timeline, position) => {
        if (!divider) return;
        gsap.set(divider, { scaleX: 0 });
        timeline.to(divider, { scaleX: 1, duration: 0.85, ease: 'power4.out' }, position);
      };
      const createTimeline = (triggerElement) => {
        return gsap.timeline({
          scrollTrigger: {
            trigger: triggerElement,
            start: anim.start,
            once: true,
            invalidateOnRefresh: true,
          },
        });
      };
      if (!isMobile) {
        const tl = createTimeline(section);
        statItems.forEach((item, index) => {
          const numberEl = item.querySelector('.stat_number');
          const componentDividers = item.querySelectorAll('.stat_divider, .bottom_divider, .top_divider');
          const staggerBase = index * 0.12;
          if (numberEl) {
            const originalText = numberEl.textContent.trim();
            const hasPercent = originalText.includes('%');
            const targetNumber = parseFloat(originalText.replace(/[^\d.]/g, ''));
            const counter = { value: 0 };
            tl.fromTo(
              counter,
              { value: 0 },
              {
                value: targetNumber,
                duration: 1.3,
                ease: 'power3.out',
                onUpdate: () => {
                  numberEl.textContent = Math.round(counter.value).toLocaleString() + (hasPercent ? '%' : '');
                },
              },
              staggerBase,
            );
          }
          componentDividers.forEach((dividerLine) => animateDivider(dividerLine, tl, staggerBase));
        });
        const sectionDividers = section.querySelectorAll(':scope > .stat_divider, :scope > .bottom_divider, :scope > .top_divider');
        sectionDividers.forEach((sectionLine, sIndex) => animateDivider(sectionLine, tl, sIndex * 0.15));
      } else {
        statItems.forEach((item) => {
          const numberEl = item.querySelector('.stat_number');
          const componentDividers = item.querySelectorAll('.stat_divider, .bottom_divider, .top_divider');
          const tl = createTimeline(item);
          if (numberEl) {
            const originalText = numberEl.textContent.trim();
            const hasPercent = originalText.includes('%');
            const targetNumber = parseFloat(originalText.replace(/[^\d.]/g, ''));
            const counter = { value: 0 };
            tl.fromTo(
              counter,
              { value: 0 },
              {
                value: targetNumber,
                duration: 1.3,
                ease: 'power3.out',
                onUpdate: () => {
                  numberEl.textContent = Math.round(counter.value).toLocaleString() + (hasPercent ? '%' : '');
                },
              },
              0,
            );
          }
          componentDividers.forEach((dividerLine) => animateDivider(dividerLine, tl, 0.15));
        });
      }
    });
    // ============================================================
    // 6. INTERACTIVE COMPONENT: TABS AUTO-ROTATION ENGINE
    // ============================================================
    const tabsSection = document.querySelector('.tabs_section');
    if (tabsSection) {
      const items = tabsSection.querySelectorAll('.list_item');
      const image = tabsSection.querySelector('.featured_image img');
      const imageWrap = tabsSection.querySelector('.featured_image');
      if (items.length && image && imageWrap) {
        const ROTATION_DURATION = 4;
        let currentIndex = 0;
        let progressTl = null;
        let imageTl = null;
        let isTabsVisible = false;
        let tabOverlay = imageWrap.querySelector('.image_reveal_overlay');
        if (!tabOverlay) {
          tabOverlay = document.createElement('div');
          tabOverlay.classList.add('image_reveal_overlay');
          imageWrap.appendChild(tabOverlay);
        }
        gsap.set(tabOverlay, { xPercent: 100 });
        function resetProgressLines() {
          items.forEach((item) => {
            item.classList.remove('is-active');
            item.style.opacity = '0.45';
            const line = item.querySelector('.active_progress_line');
            if (line) gsap.set(line, { scaleX: 0 });
          });
        }
        function revealTabImage(newImageSrc) {
          if (imageTl) imageTl.kill();
          imageTl = gsap.timeline();
          imageTl
            .set(tabOverlay, { xPercent: 0 })
            .set(image, { scale: anim.imageScale })
            .call(() => {
              image.removeAttribute('srcset'); // ADD THIS
              image.removeAttribute('sizes'); // ADD THIS
              image.src = newImageSrc;
            })
            .to(tabOverlay, { xPercent: 100, duration: anim.imageDuration, ease: 'power4.inOut' })
            .to(image, { scale: 1, duration: anim.imageDuration + 0.15, ease: 'power4.out' }, 0);
        }
        function activateTab(index) {
          if (!isTabsVisible) return;
          const item = items[index];
          const imageSrc = item?.getAttribute('data-image');
          if (!item || !imageSrc) return;
          if (progressTl) progressTl.kill();
          resetProgressLines();
          item.classList.add('is-active');
          item.style.opacity = '1';
          currentIndex = index;
          revealTabImage(imageSrc);
          const activeLine = item.querySelector('.active_progress_line');
          if (activeLine) {
            progressTl = gsap.timeline({
              onComplete: () => {
                if (!isTabsVisible) return;
                activateTab((currentIndex + 1) % items.length);
              },
            });
            progressTl.fromTo(activeLine, { scaleX: 0 }, { scaleX: 1, duration: ROTATION_DURATION, ease: 'none' });
          }
        }
        items.forEach((item, index) => {
          item.addEventListener('click', () => {
            isTabsVisible = true;
            activateTab(index);
          });
        });
        ScrollTrigger.create({
          trigger: tabsSection,
          start: isMobile ? 'top 65%' : 'top bottom',
          end: 'bottom top',
          onEnter: () => {
            isTabsVisible = true;
            activateTab(currentIndex);
          },
          onEnterBack: () => {
            isTabsVisible = true;
            progressTl?.resume();
          },
          onLeave: () => {
            isTabsVisible = false;
            progressTl?.pause();
          },
          onLeaveBack: () => {
            isTabsVisible = false;
            progressTl?.pause();
          },
        });
      }
    }
    // ============================================================
    // 7. RECALIBRATION HELPERS (Handles image loads & resize shifts)
    // ============================================================
    function refreshScrollTriggers() {
      ScrollTrigger.refresh(true);
    }
    window.addEventListener('load', () => {
      refreshScrollTriggers();
      setTimeout(refreshScrollTriggers, 300);
      setTimeout(refreshScrollTriggers, 800);
      setTimeout(refreshScrollTriggers, 1500);
    });
    document.querySelectorAll('img').forEach((img) => {
      if (img.complete) return;
      img.addEventListener('load', refreshScrollTriggers, { once: true });
    });
    if (!isMobile) {
      window.addEventListener('resize', refreshScrollTriggers);
    }
    window.addEventListener('orientationchange', () => {
      setTimeout(refreshScrollTriggers, 500);
    });
  });

  // ============================================================

        scrub: 0.2,

    .fromTo('.hero-section', { scale: 1 }, { scale: 0.65, ease: 'none' });*/
</script>
